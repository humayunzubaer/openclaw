name: openclaw_scanner
description: Offline-first Bengali document scanner.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.3
  camera: ^0.11.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  archive: ^3.6.1
  xml: ^6.5.0
  image: ^4.2.0
  flutter_riverpod: ^2.5.1
  share_plus: ^10.0.0
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  ffigen: ^14.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata/ben.traineddata
    - assets/models/lama_fp16.onnx
    - assets/models/handseg_xnnpack.onnx
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
