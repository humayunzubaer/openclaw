<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Customs Bond Audit — Import Intelligence</title>
    <link rel="stylesheet" href="/styles.css" />
    <meta name="theme-color" content="#1f5f8b" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">⚖️</span>
        <div>
          <strong>Customs Bond Audit — Import Intelligence</strong>
          <small>Module 1 · প্রাপ্যতা বনাম আমদানি · ১০০% লোকাল</small>
        </div>
      </div>
      <span id="health" class="badge badge-muted">সংযোগ যাচাই…</span>
    </header>

    <main>
      <section class="card">
        <h2>১. নথি ও প্যারামিটার</h2>
        <div class="grid2">
          <label>প্রাপ্যতা শীট (Entitlement) <span class="req">*</span>
            <input type="file" id="ent" accept=".xlsx,.xls,.csv" />
          </label>
          <label>আমদানি (AIS/MIS/IM-4) <span class="req">*</span>
            <input type="file" id="imp" accept=".xlsx,.xls,.csv" />
          </label>
          <label>স্থানীয় ক্রয় (ঐচ্ছিক)
            <input type="file" id="local" accept=".xlsx,.xls,.csv" />
          </label>
          <label>নতুন প্রাপ্যতা/UP অনুমোদনের তারিখ (মেয়াদোত্তর দাবির সীমা)
            <input type="date" id="nxt" />
          </label>
          <label>বন্ড লাইসেন্সের ধারণক্ষমতা (মে.টন, ঐচ্ছিক)
            <input type="number" id="lic" step="0.001" placeholder="যেমন: 3400" />
          </label>
          <label>ওয়্যারহাউসের ধারণক্ষমতা (মে.টন, ঐচ্ছিক)
            <input type="number" id="wh" step="0.001" placeholder="প্রদত্ত মান" />
          </label>
          <label class="check">
            <input type="checkbox" id="ext" />
            <span>বিধি ৮ — বর্ধিত প্রাপ্যতা (৩ মাস) প্রযোজ্য (বিয়োজন-যাচাই পর্যবেক্ষণ দেখাবে)</span>
          </label>
        </div>
        <div class="row-end">
          <button id="xlsx" class="btn btn-ghost">📊 Excel কার্যপত্র</button>
          <button id="run" class="btn btn-primary">🔍 বিশ্লেষণ করুন</button>
        </div>
        <div id="msg" class="msg"></div>
      </section>

      <section id="out" class="hidden">
        <div class="card">
          <h2>২. দাবির সারসংক্ষেপ</h2>
          <div id="stats" class="stat-row"></div>
          <div id="grandtotal" class="grandtotal"></div>
        </div>
        <div class="card">
          <h2>৩. সতর্কতা ও টীকা</h2>
          <ul id="warnings" class="warnings"></ul>
        </div>
        <div id="rule8"></div>
        <div id="tables"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
