name: Personal Scanner core

on:
  push:
    paths:
      - 'personal_scanner/**'
      - '.github/workflows/personal-scanner-core.yml'
  pull_request:
    paths:
      - 'personal_scanner/**'
      - '.github/workflows/personal-scanner-core.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ocr-benchmark:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: personal_scanner
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV, Tesseract (ben + eng) and Bengali fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libopencv-core-dev libopencv-imgproc-dev libopencv-imgcodecs-dev \
            libtesseract-dev libleptonica-dev tesseract-ocr tesseract-ocr-ben tesseract-ocr-eng \
            libraqm0 fonts-noto-core fonts-lohit-beng-bengali fonts-beng-extra fonts-freefont-ttf \
            poppler-utils
          pip install -r bench/requirements.txt -r server/requirements.txt

      - name: Build core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate synthetic benchmark
        run: python3 bench/generate.py

      - name: Baseline (stock Tesseract)
        run: python3 bench/score.py --engine raw

      - name: Personal Scanner (regression gate)
        run: |
          python3 bench/score.py --engine ps --min-char 0.97 --min-num 0.93
          python3 bench/score.py --engine ps --manifest bench/reference/manifest.json --min-char 0.93 --min-num 0.95

      - name: OCR server smoke test (image and 2-page PDF)
        run: |
          (cd server && PS_OCR_BIN=../build/ps_ocr PS_API_KEY=ci python3 -m uvicorn app:app --port 8080 &)
          for i in $(seq 30); do curl -sf localhost:8080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@bench/reference/revenue-table.png localhost:8080/v1/scan)" = 401
          curl -sf -H "X-API-Key: ci" -F file=@bench/reference/revenue-table.png localhost:8080/v1/scan > image.json
          python3 -c "from PIL import Image; a=Image.open('bench/reference/revenue-table.png').convert('RGB'); a.save('two.pdf', save_all=True, append_images=[Image.open('bench/reference/government-form.png').convert('RGB')])"
          curl -sf -H "X-API-Key: ci" -F file=@two.pdf localhost:8080/v1/scan > pdf.json
          curl -sf -H "X-API-Key: ci" -F file=@two.pdf "localhost:8080/v1/scan?page=2" > page2.json
          python3 - <<'PY'
          import json
          image, pdf, page2 = (json.load(open(n)) for n in ("image.json", "pdf.json", "page2.json"))
          assert image["page_count"] == 1 and "রাজস্ব" in image["pages"][0]["text"], image
          assert pdf["page_count"] == 2 and pdf["pages_returned"] == [1, 2], pdf
          assert page2["pages_returned"] == [2] and page2["pages"][0]["text"] == pdf["pages"][1]["text"], page2
          print("server OK")
          PY
